{% extends 'restaurants/base.html' %}
{% block content %}
  <h2>Delete restaurant</h2>

  <p>
    Are you sure you want to delete restaurant <strong>{{ restaurant.name }}</strong>?
  </p>

  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
  </form>

  <p>
    <a href="restaurants:restaurant_list">No, go back</a>
  </p>
{% endblock %}
