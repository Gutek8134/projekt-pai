<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% block title %}
        Restaurants
      {% endblock %}
    </title>
  </head>

  <body>
    <header>
      <h1>Restaurants</h1>
      <nav>
        <a href="{% url 'restaurants:restaurant_list' %}">Restaurant list</a>
        <a href="{% url 'restaurants:search_reviews' %}">Search for review</a>
        {% if user.is_authenticated %}
          <a href="{% url 'restaurants:add_restaurant' %}">Add restaurant</a>
          <a href="{% url 'password_change' %}">Change password</a>
          <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log Out</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Log In</a>
          <a href="{% url 'signup' %}">Sign Up</a>
        {% endif %}
      </nav>
      <hr />
    </header>
    <main>
      {% block content %}

      {% endblock %}
    </main>
  </body>
</html>
